[project]
site_name = "django-mjml-templates"
site_description = "Email templates as .mjml files with the Django template language."
site_url = "https://smileychris.github.io/django-mjml-templates/"
repo_url = "https://github.com/SmileyChris/django-mjml-templates"
nav = [
  { "Get started" = "README.md" },
  { "How-to" = [
    { "Build a simple design" = "how-to/build-a-design.md" },
    { "Write a shared layout" = "how-to/write-a-layout.md" },
    { "Send from a task or command" = "how-to/send-from-a-task.md" },
    { "Test an email" = "how-to/test-an-email.md" },
    { "Make links absolute" = "how-to/absolute-urls.md" },
    { "Preview an email" = "how-to/preview-an-email.md" },
    { "Customise the preview" = "how-to/customise-preview.md" },
  ] },
  { "Reference" = [
    { "API" = "reference/api.md" },
    { "Plain-text fallback" = "reference/plain-text.md" },
    { "Preview" = "reference/preview.md" },
  ] },
  { "Explanation" = [
    { "Why this" = "explanation/why.md" },
    { "How a render works" = "explanation/how-a-render-works.md" },
    { "How the preview is designed" = "explanation/preview-design.md" },
  ] },
]

[project.theme]
features = ["content.code.copy", "navigation.instant"]
